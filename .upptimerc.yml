# Reader Friendly állapotoldal
# Dokumentáció: https://upptime.js.org/docs/configuration
owner: ketszeri
repo: reader-friendly-status
user-agent: ketszeri

# Nincs titkos URL vagy kulcs: csak nyilvános címeket ellenőrzünk.
secrets: []

sites:
  - name: Reader Friendly szolgáltatás
    slug: szolgaltatas
    url: https://reader.ketszeri.hu/health
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '"status":"ok"'
    icon: https://reader.ketszeri.hu/favicon.ico
  - name: Reader Friendly weboldal
    slug: weboldal
    url: https://reader.ketszeri.hu/
    method: HEAD
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    icon: https://reader.ketszeri.hu/favicon.ico

# Nincs kijelölt felelős és nincs értesítés: a leállásokról csak a hibajegy készül.
skipDescriptionUpdate: true
skipTopicsUpdate: true

commitMessages:
  readmeContent: "Összefoglaló frissítése [skip ci] [upptime]"
  summaryJson: "Állapot-összesítő frissítése [skip ci] [upptime]"
  statusChange: "$SITE_NAME: $STATUS ($RESPONSE_CODE, $RESPONSE_TIME ms) [skip ci] [upptime]"
  graphsUpdate: "Grafikonok frissítése [skip ci] [upptime]"

status-website:
  cname: status.ketszeri.hu
  name: Reader Friendly állapot
  logoUrl: https://reader.ketszeri.hu/favicon.ico
  favicon: https://reader.ketszeri.hu/favicon.ico
  theme: light
  introTitle: "A Reader Friendly szolgáltatás állapota"
  introMessage: "Ezen az oldalon látható, hogy a Reader Friendly szolgáltatás és weboldal éppen elérhető-e. Az ellenőrzés ötpercenként fut. Ha kérdése van, vagy hibát tapasztal, a [Támogatás](https://reader.ketszeri.hu/tamogatas) oldalon talál segítséget."
  navbar:
    - title: Állapot
      href: /
    - title: Reader Friendly
      href: https://reader.ketszeri.hu/
    - title: Támogatás
      href: https://reader.ketszeri.hu/tamogatas
  robotsText: "User-agent: *\nAllow: /"


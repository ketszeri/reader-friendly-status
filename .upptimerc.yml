# Reader Friendly állapotoldal
# Dokumentáció: https://upptime.js.org/docs/configuration
owner: ketszeri
repo: reader-friendly-status
user-agent: ketszeri

# Nincs titkos URL vagy kulcs: csak nyilvános címeket ellenőrzünk.
secrets: []

sites:
  - name: Reader Friendly szolgáltatás
    slug: szolgaltatas
    url: https://reader.ketszeri.hu/health
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '"status":"ok"'
    icon: https://status.ketszeri.hu/reader-friendly-32.png
  - name: Reader Friendly weboldal
    slug: weboldal
    url: https://reader.ketszeri.hu/
    method: HEAD
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    icon: https://status.ketszeri.hu/reader-friendly-32.png

# Nincs kijelölt felelős és nincs értesítés: a leállásokról csak a hibajegy készül.
skipDescriptionUpdate: true
skipTopicsUpdate: true

# Szöveges állapotjelzők a commit üzenetek elején (az Upptime ezekből olvassa ki az állapotot).
commitPrefixStatusUp: "[fent]"
commitPrefixStatusDegraded: "[lassu]"
commitPrefixStatusDown: "[leallt]"

commitMessages:
  readmeContent: "Összefoglaló frissítése [skip ci] [upptime]"
  summaryJson: "Állapot-összesítő frissítése [skip ci] [upptime]"
  statusChange: "$PREFIX $SITE_NAME: $STATUS ($RESPONSE_CODE in $RESPONSE_TIME ms) [skip ci] [upptime]"
  graphsUpdate: "Grafikonok frissítése [skip ci] [upptime]"

status-website:
  cname: status.ketszeri.hu
  name: Reader Friendly állapot
  logoUrl: https://status.ketszeri.hu/reader-friendly-256.png
  favicon: https://status.ketszeri.hu/reader-friendly-32.png
  themeUrl: https://status.ketszeri.hu/reader-friendly.css
  customHeadHtml: '<link rel="apple-touch-icon" href="https://status.ketszeri.hu/apple-touch-icon.png"><meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)"><meta name="color-scheme" content="light dark">'
  introTitle: "A Reader Friendly szolgáltatás állapota"
  introMessage: "Itt látod, hogy a Reader Friendly szolgáltatás és a weboldal éppen elérhető-e. Ötpercenként ellenőrizzük. Ha kérdésed van, vagy valami nem működik, a [Támogatás](https://reader.ketszeri.hu/tamogatas) oldalon találsz segítséget."
  navbar:
    - title: Állapot
      href: /
    - title: Reader Friendly
      href: https://reader.ketszeri.hu/
    - title: Támogatás
      href: https://reader.ketszeri.hu/tamogatas
  # Az Upptime az összesítő sor elé emojit tesz; ezt eltávolítjuk.
  js: "(function(){var r=/^[^\\p{L}\\p{N}]+/u;function f(){document.querySelectorAll('article:not(.link)').forEach(function(a){var n=a.firstChild;if(n&&n.nodeType===3&&r.test(n.nodeValue)){n.nodeValue=n.nodeValue.replace(r,'')}})}new MutationObserver(f).observe(document.documentElement,{childList:true,subtree:true,characterData:true});document.addEventListener('DOMContentLoaded',f)})();"
  robotsText: "User-agent: *\nAllow: /"

